<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 324" width="1000" height="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How the benchmark works</title>
  <desc>Tracking and the play-by-play feed go into a detector (possessions, ball handler, actions) or a play-by-play matcher; its output is evaluated against SkillCorner's ground truth and added to the leaderboard.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#71717a"/>
    </marker>
    <style>
      .card { fill: #ffffff; stroke: #d4d4d8; stroke-width: 1.5; }
      .accent { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
      .pill { fill: #f4f4f5; stroke: none; }
      .title { font-size: 15px; font-weight: 600; fill: #18181b; }
      .sub { font-size: 12px; fill: #71717a; }
      .pilltext { font-size: 11px; fill: #3f3f46; text-anchor: middle; }
      .label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; fill: #a1a1aa; }
      .line { stroke: #71717a; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="1000" height="324" rx="12" fill="#fafafa"/>

  <!-- column labels -->
  <text class="label" x="24" y="34">INPUTS</text>
  <text class="label" x="290" y="34">DETECTORS (BASELINE OR YOURS)</text>
  <text class="label" x="650" y="34">SCORING</text>
  <text class="label" x="840" y="34">RESULTS</text>

  <!-- inputs -->
  <rect class="card" x="24" y="52" width="200" height="64" rx="8"/>
  <text class="title" x="40" y="80">Tracking</text>
  <text class="sub" x="40" y="100">SkillCorner · 25 fps</text>

  <rect class="card" x="24" y="132" width="200" height="64" rx="8"/>
  <text class="title" x="40" y="160">Play-by-play feed</text>
  <text class="sub" x="40" y="180">Liga ACB + fouled shots</text>

  <rect class="card" x="24" y="236" width="200" height="64" rx="8"/>
  <text class="title" x="40" y="264">Ground truth</text>
  <text class="sub" x="40" y="284">SkillCorner · frame-level events</text>

  <!-- inputs to method -->
  <path class="line" d="M224,84 H245 V204"/>
  <path class="line" d="M224,164 H245"/>
  <path class="line" d="M245,100 H288" marker-end="url(#arrow)"/>
  <path class="line" d="M245,204 H288" marker-end="url(#arrow)"/>

  <!-- method -->
  <rect class="card" x="290" y="52" width="300" height="96" rx="8"/>
  <text class="title" x="306" y="80">Detection</text>
  <rect class="pill" x="304" y="100" width="84" height="24" rx="12"/>
  <text class="pilltext" x="346" y="116">possessions</text>
  <path class="line" d="M395,107 L400,112 L395,117"/>
  <rect class="pill" x="408" y="100" width="92" height="24" rx="12"/>
  <text class="pilltext" x="454" y="116">ball handler</text>
  <path class="line" d="M507,107 L512,112 L507,117"/>
  <rect class="pill" x="520" y="100" width="60" height="24" rx="12"/>
  <text class="pilltext" x="550" y="116">actions</text>

  <rect class="card" x="290" y="172" width="300" height="64" rx="8"/>
  <text class="title" x="306" y="200">Play-by-play matching</text>
  <text class="sub" x="306" y="220">pins each play-by-play event to its frame</text>

  <!-- method to scoring -->
  <path class="line" d="M590,100 H620 V204 H590"/>
  <path class="line" d="M620,148 H648" marker-end="url(#arrow)"/>

  <!-- ground truth to scoring -->
  <path class="line" d="M224,268 H725 V192" marker-end="url(#arrow)"/>

  <!-- scoring -->
  <rect class="card" x="650" y="106" width="150" height="84" rx="8"/>
  <text class="title" x="666" y="136">Evaluate</text>
  <text class="sub" x="666" y="156">compared with</text>
  <text class="sub" x="666" y="172">ground truth (±1 s)</text>

  <path class="line" d="M800,148 H838" marker-end="url(#arrow)"/>

  <!-- results -->
  <rect class="accent" x="840" y="106" width="136" height="84" rx="8"/>
  <text class="title" x="856" y="142">Leaderboard</text>
  <text class="sub" x="856" y="162">report per run</text>
</svg>
